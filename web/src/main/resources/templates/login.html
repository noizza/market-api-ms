<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosco: Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-body-secondary d-flex align-items-center justify-content-center vh-100 position-relative">

    <div class="position-absolute top-0 end-0 m-3">
        <button id="themeToggle" class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-2 rounded-1 fw-medium shadow-sm bg-body">
            <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
            <span id="themeText">Modo Oscuro</span>
        </button>
    </div>

    <div class="container" style="max-width: 850px;">
        <div class="row g-0 bg-body rounded-1 shadow-sm border overflow-hidden">
            
            <div class="col-md-6 bg-body-tertiary d-flex align-items-center justify-content-center p-5 border-end">
                <img th:src="@{/img/logo_pelota_white_conic.png}" src="img/logo_pelota_white_conic.png" alt="Kiosco La Canchita" class="img-fluid" style="max-height: 220px; object-fit: contain;">
            </div>

            <div class="col-md-6 p-4 p-lg-5 d-flex flex-column justify-content-center">
                
                <div class="mb-4">
                    <h2 class="fw-semibold text-body h4 mb-1">Iniciar sesión</h2>
                    <p class="text-muted small mb-0">Usa tu cuenta de Kiosco</p>
                </div>

                <div th:if="${not #strings.isEmpty(error)}" class="alert alert-danger py-2 px-3 small rounded-1 mb-3" role="alert">
                    <p th:text="${error}" class="m-0"></p>
                </div>

                <form th:action="@{/login}" th:object="${loginForm}" method="post">
                    
                    <div class="mb-3">
                        <label for="username" class="form-label small fw-medium text-secondary mb-1">Username:</label>
                        <input th:field="*{username}" type="text" class="form-control form-control-sm rounded-1" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label small fw-medium text-secondary mb-1">Password:</label>
                        <input th:field="*{password}" type="password" class="form-control form-control-sm rounded-1" required>
                    </div>

                    <div class="mb-4 form-check">
                        <input th:field="*{rememberMe}" type="checkbox" class="form-check-input rounded-1" id="rememberMe" name="remember-me">
                        <label class="form-check-label small text-secondary fw-medium" for="rememberMe">Mantener usuario conectado</label>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-sm rounded-1 fw-medium py-2" style="background-color: #0067b8; border-color: #0067b8;">
                            Login
                        </button>
                    </div>

                </form>
            </div>

        </div>
    </div>

    <script>
        const toggleBtn = document.getElementById('themeToggle');
        const htmlElem = document.documentElement;
        const themeIcon = document.getElementById('themeIcon');
        const themeText = document.getElementById('themeText');

        toggleBtn.addEventListener('click', () => {
            const currentTheme = htmlElem.getAttribute('data-bs-theme');
            if (currentTheme === 'light') {
                htmlElem.setAttribute('data-bs-theme', 'dark');
                themeIcon.className = 'bi bi-sun-fill';
                themeText.textContent = 'Modo Claro';
            } else {
                htmlElem.setAttribute('data-bs-theme', 'light');
                themeIcon.className = 'bi bi-moon-stars-fill';
                themeText.textContent = 'Modo Oscuro';
            }
        });
    </script>
</body>
</html>
